name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  generate-version-number:
    runs-on: ubuntu-latest

    outputs:
      version_number: ${{ steps.version.outputs.version_number }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install mise
      uses: jdx/mise-action@v4.3.0
      with:
        cache: false
        version: 2026.9.5
        mise_toml: |
          [tools]
          "pipx:changes-semver" = "6"
          "pipx:inseven-build-tools" = "1"

    - name: Generate version and build numbers
      id: version
      run: |
        VERSION_NUMBER=`changes version`
        BUILD_NUMBER=`build-tools generate-build-number`
        echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
        echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

  rust-build:
    strategy:
      matrix:
        os:
        - ubuntu-26.04
        - ubuntu-26.04-arm
        - inseven-macos-26
    runs-on: ${{ matrix.os }}

    needs:
    - generate-version-number

    env:
      VERSION_NUMBER: ${{ needs.generate-version-number.outputs.version_number }}
      BUILD_NUMBER: ${{ needs.generate-version-number.outputs.build_number }}

      # Ensure mise installs are contained within the project workspace.
      MISE_CACHE_DIR: ${{ github.workspace }}/.mise/cache
      MISE_CONFIG_DIR: ${{ github.workspace }}/.mise/config
      MISE_DATA_DIR: ${{ github.workspace }}/.mise/data
      MISE_STATE_DIR: ${{ github.workspace }}/.mise/state

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    # Coarse-grained cache of the in-tree .mise directory.
    - name: Cache mise
      id: cache-mise
      uses: actions/cache@v6
      with:
        path: .mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise--${{ hashFiles('mise.toml') }}

    - name: Install mise
      uses: jdx/mise-action@v4.3.0
      with:
        version: 2026.9.5
        cache: false

    - name: Install dependencies
      run: scripts/install-dependencies.sh

    - name: Build and test
      run: scripts/build.sh
